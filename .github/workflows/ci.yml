name: Yazilim Tasarim Pattern Kontrolu (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Bilgisayara Cek
      uses: actions/checkout@v3

    - name: Python Ortamini Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Pip Paket Yoneticisini Guncelle
      run: |
        python -m pip install --upgrade pip

    - name: Sepet Projesini Calistir ve Test Et
      run: |
        python src/sepet.pyS
